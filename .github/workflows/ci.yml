name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualify-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run pytest tests/test_e2e.py -q
      - run: uv run pytest tests/test_hygiene.py -q

  qualify-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: uv sync --locked --extra pdf
      - name: PDF qualification
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: uv run pytest tests/test_pdf_qualify.py tests/test_cli_e2e.py -q