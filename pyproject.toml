[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curiosity-engine"
version = "0.1.0"
description = "Local-first personal curiosity engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "platformdirs>=4.3.0",
  "pydantic>=2.10.0",
  "trafilatura>=2.2,<3",
]

[project.optional-dependencies]
pdf = ["docling>=2.0"]

[project.scripts]
curiosity = "curiosity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/curiosity"]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # SQL DDL is kept readable by ruff format, not arbitrary line splitting.
